server {
  listen 80;
  server_name erp.example.com;

  root /var/www/erp/frontend;
  index index.html;

  # Chặn flood upload diagnostic (cần limit_req_zone zalopilot_upload trong http { })
  # limit_req_zone $binary_remote_addr zone=zalopilot_upload:10m rate=2r/m;
  location = /api/zalopilot/diagnostics/upload {
    client_max_body_size 52m;
    # limit_req zone=zalopilot_upload burst=1 nodelay;
    proxy_pass http://127.0.0.1:3000/api/zalopilot/diagnostics/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:3000/uploads/;
    proxy_set_header Host $host;
  }

  location /zalopilot/ {
    proxy_pass http://127.0.0.1:3000/zalopilot/;
    proxy_set_header Host $host;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Một số trình duyệt hỏi /favicon.ico trước; nếu không có file, try_files ở / sẽ trả về
  # index.html (text/html) → icon tab bị hỏng. Trỏ tạm sang favicon.svg nếu chưa có .ico.
  location = /favicon.ico {
    try_files $uri /favicon.svg =404;
    default_type image/svg+xml;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

